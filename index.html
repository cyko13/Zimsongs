<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Songs of the Year: Zim Edition</title>
<meta name="description" content="Pick one Zimbabwean song from every year, 1980 to 2025, and see what everyone else picked.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Look: warm cream paper, deep msasa-green ink, brass gold accents, Zimbabwe flag stripe. Fraunces serif for headings, Figtree for reading. */
:root{--bg:#f5f0e6;--surface:#faf6ee;--line:#d9cfbd;--fg:#163c32;--muted:#4f5c56;--accent:#163c32;--accent-ink:#fbf6ea;--accent-soft:#e3ebe5;--gold:#b88a2c;--brass:#b88a2c;--ok:#163c32;--dock:#163c32;--dock-fg:#f7f1e3;--deco:#d8c9a6;
--display:"Fraunces",Georgia,"Times New Roman",serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1a;--surface:#15291f;--line:#2c4238;--fg:#efe7d4;--muted:#b9b2a0;--accent:#d9ae55;--accent-ink:#13241d;--accent-soft:#22362c;--gold:#d9ae55;--brass:#d9ae55;--ok:#d9ae55;--dock:#0a1712;--dock-fg:#f2ead8;--deco:#2a3d33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1f1a;--surface:#15291f;--line:#2c4238;--fg:#efe7d4;--muted:#b9b2a0;--accent:#d9ae55;--accent-ink:#13241d;--accent-soft:#22362c;--gold:#d9ae55;--brass:#d9ae55;--ok:#d9ae55;--dock:#0a1712;--dock-fg:#f2ead8;--deco:#2a3d33;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 140px}
.deco{position:fixed;top:60px;right:-40px;width:min(46vw,560px);height:auto;color:var(--deco);pointer-events:none;z-index:0;opacity:.9}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;text-decoration:none}
.brand em{font-style:italic;font-weight:600;color:var(--gold)}
.count{margin-left:auto;font-family:var(--display);font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:6px;
  font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;text-decoration:none;cursor:pointer;border:2px solid var(--fg);background:var(--fg);color:var(--bg);
  transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,60,50,.18)}
.btn:active{transform:none;box-shadow:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkish{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:17px}

/* Start page */
.start{min-height:calc(100svh - 220px);display:grid;align-content:center;justify-items:start;gap:18px;padding-block:40px}
.start h1.title{font-size:clamp(52px,11vw,124px)}
.start .lede{font-size:clamp(19px,2.4vw,24px)}
.btn.big{min-height:68px;padding:16px 44px;font-size:24px;border-radius:8px;margin-top:8px}
.start .alt{font-size:17px;color:var(--muted)}
.disclaimer{font-size:15px;line-height:1.5;color:var(--muted);max-width:60ch;margin:0;padding:10px 14px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 6px 6px 0}
.pager+.disclaimer{margin-top:18px}

/* Home */
.stripe{display:flex;height:7px;border-radius:4px;overflow:hidden;width:250px}.stripe i{flex:1}
.stripe i:nth-child(1){background:#1f7a4c}.stripe i:nth-child(2){background:#c9982b}.stripe i:nth-child(3){background:#c0392b}.stripe i:nth-child(4){background:#1b1b1b}
.hero{padding-block:36px 10px;display:grid;gap:14px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:6px 0 0}
h1.title{font-family:var(--display);font-weight:700;font-size:clamp(42px,8.4vw,92px);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1.title em{font-style:italic;font-weight:600;color:var(--gold)}
.lede{max-width:56ch;color:var(--fg);margin:0;font-size:19px}
.howto{margin:0;padding-left:1.2em;color:var(--muted);font-size:17px;display:grid;gap:2px}
.decade{margin-top:30px;display:grid;gap:12px}
.decade h2{font-family:var(--display);font-size:14px;margin:0;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.yt{display:grid;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;min-width:0;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.yt:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:0 6px 16px rgba(22,60,50,.12)}
.yt b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.yt span{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yt.done span{color:var(--accent-ink);opacity:.9}

/* Year page */
.yhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:22px 20px;flex-wrap:wrap}
.yyear{font-family:var(--display);font-weight:700;font-size:clamp(56px,10vw,96px);line-height:1;letter-spacing:-.03em;margin:0}
.ybtns{display:flex;gap:10px}
.ybtn[aria-disabled="true"]{opacity:.3;pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;animation:fadein .6s ease both;transition:border-color .15s ease,box-shadow .2s ease}
.card:hover{border-color:var(--fg)}
.card.current{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.art{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:0;background:#000;cursor:pointer;overflow:hidden}
.art .pic{position:absolute;inset:0}
.art img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.35);transition:filter .5s ease}
.disc{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle,var(--gold) 0 13%,#111 13.5% 15%,#1e2b25 15.5% 30%,#121a16 30.5% 45%,#1e2b25 45.5% 60%,#121a16 60.5% 100%);transition:filter .5s ease}
.disc b{font-family:var(--display);font-weight:700;color:#13241d;font-size:20px}
.playic{position:absolute;left:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;font-size:18px;padding-left:3px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.card.current .playic{background:var(--gold);color:#13241d}
.meta{padding:14px 14px 16px;display:grid;gap:4px;align-content:start}
.meta .t{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;margin:0;overflow-wrap:break-word;transition:filter .5s ease}
.meta .a{font-size:16px;color:var(--muted);margin:0;transition:filter .5s ease}
.meta .pc{font-size:15px;color:var(--gold);font-weight:600;margin:0}
.save{margin-top:10px;min-height:50px;width:100%;border-radius:6px;border:2px solid var(--fg);background:transparent;color:var(--fg);font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;transition:transform .15s ease,background-color .15s ease}
.save:hover{transform:translateY(-1px)}
.save.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card.blurred .art img,.card.blurred .disc{filter:blur(16px)}
.card.blurred .meta .t,.card.blurred .meta .a,.card.blurred .meta .pc{filter:blur(8px);user-select:none}
.card.blurred .save{visibility:hidden}
.tapnote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(22,60,50,.85);color:#fbf6ea;font-weight:700;font-size:16px;padding:8px 14px;border-radius:999px;white-space:nowrap}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Now-playing bar along the bottom */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;background:var(--dock);color:var(--dock-fg);box-shadow:0 -8px 30px rgba(0,0,0,.25);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mini.open{display:block}
.minner{max-width:1000px;margin:0 auto;display:flex;gap:16px;align-items:center}
.mvid{width:168px;flex:none}
.mvid .ythost{aspect-ratio:16/9;width:100%;border-radius:4px;overflow:hidden;background:#000;transition:filter .4s ease}
.mvid .ythost iframe,.mvid .ythost>div{width:100%;height:100%;display:block;border:0}
.mvid .sphost iframe{width:100%;height:80px;border:0;border-radius:8px;display:block}
.mvid .nomedia{aspect-ratio:16/9;border-radius:4px;border:1px dashed rgba(255,255,255,.4);display:grid;place-content:center;text-align:center;font-size:15px;opacity:.85}
.mini.blurred .ythost,.mini.blurred .sphost{filter:blur(14px)}
.minfo{min-width:0;flex:1;display:grid;gap:1px}
.minfo .my{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--gold)}
.minfo .mt{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .ma{font-size:16px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtns{display:flex;gap:10px;align-items:center}
.mbtn{font:inherit;font-weight:700;font-size:18px;min-height:48px;min-width:48px;padding:0 12px;border-radius:999px;border:2px solid rgba(247,241,227,.55);background:transparent;color:var(--dock-fg);cursor:pointer;display:grid;place-items:center}
.mbtn:hover{border-color:var(--dock-fg)}
.mbtn.primary{background:var(--dock-fg);color:var(--dock);border-color:var(--dock-fg)}
.mbtn.play{min-width:58px;min-height:58px;font-size:20px}
.mseek{display:flex;align-items:center;gap:10px;margin-top:6px}
.mtime{font-size:13px;font-variant-numeric:tabular-nums;opacity:.85;min-width:36px}
.mseek input[type=range]{flex:1;min-width:0;height:28px;accent-color:var(--gold);cursor:pointer;background:transparent}
.mbtn.mute{background:var(--gold);border-color:var(--gold);color:#13241d}
.hide{display:none!important}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.share{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:16px;color:var(--muted)}

/* My picks */
.capsule{margin-top:44px;border:1.5px solid var(--fg);border-radius:8px;padding:22px;display:grid;gap:14px;background:var(--surface)}
.capsule h2{font-family:var(--display);font-size:32px;margin:0}
.capsule h3{font-family:var(--display);font-size:21px;margin:8px 0 0}
.note{font-size:17px;color:var(--muted);max-width:65ch;margin:0}
textarea.sharebox{width:100%;min-height:180px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}

/* Bottom player (used for "Play my picks") */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--dock);color:var(--dock-fg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(110%);visibility:hidden;transition:transform .3s ease,visibility .3s}
.dock.open{transform:none;visibility:visible}
.dock-inner{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.dvid{width:168px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000}
.dvid iframe,.dvid>div{width:100%;height:100%;display:block;border:0}
.dnow{min-width:0;display:grid;gap:2px}
.dnow .t{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnow .a{font-size:16px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .btn{border-color:var(--dock-fg);background:var(--dock-fg);color:var(--dock);min-height:48px;padding:10px 16px;border-radius:999px}
.dock .btn.ghost{background:transparent;color:var(--dock-fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){.deco{opacity:.45;width:70vw;right:-30vw}}
@media (max-width:760px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .meta{padding:10px 10px 12px}
  .meta .t{font-size:18px}
  .meta .a{font-size:15px}
  .save{font-size:16px;min-height:46px}
  .playic{width:40px;height:40px;left:8px;bottom:8px;font-size:15px}
  .yhead{padding-block:16px 14px}
  .brand{font-size:20px}.count{font-size:15px}
  .pager>*{flex:1 1 auto}
  .ygrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .minner{flex-wrap:wrap;gap:10px}
  .mvid{width:120px}
  .minfo .mt{font-size:17px}
  .mbtns{width:100%;justify-content:flex-end}
  body{padding-bottom:190px}
  .dock-inner{grid-template-columns:1fr auto}
  .dvid{grid-column:1 / -1;width:100%;max-height:30vh}
  body{padding-bottom:max(190px,calc(30vh + 130px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function mint(body){
  const r = await fetch(WIX + "/oauth2/token", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(Object.assign({clientId: WIX_CLIENT_ID}, body))});
  if (!r.ok) throw new Error("auth " + r.status);

  store(LS_TOK, t); return t;
}

    let f = null;
    if (t && t.refreshToken) { try { f = await mint({grantType: "refresh_token", refreshToken: t.refreshToken}); } catch(e) {} }
    if (!f) f = await mint({grantType: "anonymous"});

function home(){
  document.title = "All years · Songs of the Year: Zim Edition";
  const v = $("#view"); v.textContent = "";
  const n = count();
  const hero = el("header", "hero");
  const stripe = el("div", "stripe"); stripe.setAttribute("aria-hidden", "true"); stripe.innerHTML = "<i></i><i></i><i></i><i></i>";
  const h = el("h1", "title"); h.append("All ", el("em", null, "years"));
  const nextY = (YEARS.find(Y => !pickOf(Y.y)) || YEARS[0]).y;
  const how = el("ol", "howto");
  ["Open a year.", "Tap a blurred song to reveal it and hear it.", "Tap Pick this song on your favourite."].forEach(t => how.appendChild(el("li", null, t)));
  hero.append(el("p", "disclaimer", DISCLAIMER));
  hero.prepend(stripe, el("p", "eyebrow", FIRST + " ·· " + LAST + " ·· " + YEARS.length + " years"), h, el("p", "lede", "Pick one Zimbabwean song from every year, 1980 to " + LAST + "."), how,
    el("div", "row"), shareRow("Pick one Zimbabwean song from every year 1980–" + LAST + " and see what everyone else picked 🇿🇼", SITE));
  hero.children[5].appendChild(linkBtn(n ? "Continue with " + nextY : "Start with " + FIRST, "accent", "#" + nextY));
  v.appendChild(hero);
  const decades = {};
  YEARS.forEach(Y => (decades[Math.floor(Y.y / 10) * 10] ||= []).push(Y));
  Object.entries(decades).forEach(([d, list]) => {
    const sec = el("section", "decade");
    sec.appendChild(el("h2", null, d + "s"));
    const g = el("div", "ygrid");
    list.forEach(Y => {
      const p = pickOf(Y.y);
      const a = el("a", "yt" + (p ? " done" : "")); a.href = "#" + Y.y;
      a.append(el("b", null, Y.y), el("span", null, p ? p.t : Y.songs.length + " songs"));
      a.setAttribute("aria-label", Y.y + (p ? ", your pick: " + p.t : ", " + Y.songs.length + " songs"));
      g.appendChild(a);
    });
    sec.appendChild(g); v.appendChild(sec);
  });
  v.appendChild(capsule());
}
function capsule(){
  const c = el("section", "capsule"); c.id = "mypicks";
  c.appendChild(el("h2", null, "My picks"));
  const row = el("div", "row");
  const st = el("span", "status"); st.setAttribute("role", "status");
  const box = el("textarea", "sharebox"); box.readOnly = true; box.hidden = true; box.setAttribute("aria-label", "Your list as text");
  const pa = btn("▶ Play my picks", "accent", () => {
    const list = YEARS.map(Y => pickOf(Y.y)).filter(s => s && s.v);
    if (!list.length) { st.textContent = "Choose a song with a video first."; return; }
    playQueue(list);
  });
  const cp = btn("Copy my list", "ghost", () => {
    const txt = "Songs of the Year: Zim Edition — my picks\n" + YEARS.map(Y => { const s = pickOf(Y.y); return Y.y + ": " + (s ? s.t + " — " + s.a : "—"); }).join("\n");
    const fb = () => { box.value = txt; box.hidden = false; box.select(); st.textContent = "Select the text below and copy it."; };
    navigator.clipboard ? navigator.clipboard.writeText(txt).then(() => { st.textContent = "Copied."; box.hidden = true; }, fb) : fb();
  });
  const rs = btn("Start over", "ghost", () => {
    if (rs.dataset.armed) { picks = {}; seen = {}; opened = {}; save(); store(LS_SEEN, seen); store(LS_OPEN, opened); route(); return; }
    rs.dataset.armed = "1"; rs.textContent = "Tap again to clear all picks";
  });
  row.append(pa, cp, rs, st);
  const done = Object.keys(picks).filter(y => pickOf(y)).length;
  const capText = done
    ? "I've picked my Zim songs for " + done + " years. Recent picks: " + YEARS.map(Y => pickOf(Y.y)).filter(Boolean).slice(-3).map(s => s.t + " (" + s.y + ")").join(", ") + ". Make yours:"
    : "Pick one Zimbabwean song from every year 1980–" + LAST + ":";
  c.append(row, box, el("h3", null, "Share with friends"), shareRow(capText, SITE),
    el("p", "note", "Songs play through YouTube's or Spotify's own players. Percentages show how everyone who picked a song in that year voted. Votes are anonymous and you can change yours any time."));
  return c;
}

/* ---------- Year page: card grid, songs appear on a hidden timer, blurred until tapped ---------- */
let ticker = null;
function stopTicker(){ if (ticker) { clearInterval(ticker); ticker = null; } }
let muted = false;                 // songs only play when tapped, so sound can be on
let miniCtl = null;
function paintMute(){ const b = $("#mMute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-label", muted ? "Turn sound on" : "Turn sound off"); b.classList.toggle("mute", muted); }
$("#mMute").addEventListener("click", () => {
  muted = !muted;
  try { if (player && player.unMute) { if (muted) player.mute(); else { player.unMute(); player.playVideo(); } } } catch(e) {}
  paintMute();
});
$("#mPrev").addEventListener("click", () => { if (miniCtl) miniCtl.prev(); });
$("#mNext").addEventListener("click", () => { if (miniCtl) miniCtl.next(); });
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let seeking = false;
const miniPlayer = () => (player && playerHost === $("#mYt") && player.getPlayerState) ? player : null;
$("#mPlay").addEventListener("click", () => {
  const p = miniPlayer(); if (!p) return;
  try { const st = p.getPlayerState(); if (st === 1 || st === 3) p.pauseVideo(); else p.playVideo(); } catch(e) {}
  setTimeout(syncMini, 150);
});
$("#mSeek").addEventListener("input", () => { seeking = true; $("#mCur").textContent = fmtT(+$("#mSeek").value); });
$("#mSeek").addEventListener("change", () => { const p = miniPlayer(); if (p) { try { p.seekTo(+$("#mSeek").value, true); } catch(e) {} } seeking = false; });
function syncMini(){
  if (!$("#mini").classList.contains("open")) return;
  const p = miniPlayer(), b = $("#mPlay");
  if (!p) return;
  let st = -1, cur = 0, dur = 0;
  try { st = p.getPlayerState(); cur = p.getCurrentTime() || 0; dur = p.getDuration() || 0; } catch(e) {}
  const playing = st === 1 || st === 3;
  b.textContent = playing ? "❚❚" : "▶"; b.setAttribute("aria-label", playing ? "Pause" : "Play");
  const s = $("#mSeek");
  if (dur > 0) { s.max = Math.floor(dur); $("#mDur").textContent = fmtT(dur); }
  if (!seeking) { s.value = Math.floor(cur); $("#mCur").textContent = fmtT(cur); }
}
setInterval(syncMini, 500);
$("#mClose").addEventListener("click", () => { pauseVideo(); $("#mSp").textContent = ""; $("#mini").classList.remove("open"); });
function closeMini(){ $("#mini").classList.remove("open"); miniCtl = null; }

function year(y){
  const Y = BY[y], total = Y.songs.length;
  document.title = y + " · Songs of the Year: Zim Edition";
  count();
  const v = $("#view"); v.textContent = "";
  const S = {cur: -1};

  const head = el("div", "yhead");
  const prevY = linkBtn("◂ " + (y - 1), "ghost ybtn", "#" + (y - 1)); prevY.setAttribute("aria-label", "Previous year, " + (y - 1));
  const nextY = linkBtn((y + 1) + " ▸", "accent ybtn", "#" + (y + 1)); nextY.setAttribute("aria-label", "Next year, " + (y + 1));
  if (y <= FIRST) prevY.setAttribute("aria-disabled", "true");
  if (y >= LAST) nextY.setAttribute("aria-disabled", "true");
  const ybtns = el("div", "ybtns"); ybtns.append(prevY, nextY);
  head.append(el("h1", "yyear", y), ybtns);

  const grid = el("div", "cards"); grid.setAttribute("aria-label", "Songs from " + y);
  const pager = el("div", "pager");
  pager.appendChild(linkBtn("◂ All years", "ghost", "#years"));
  const rs = btn("↺ Reset " + y, "ghost", () => {
    if (!rs.dataset.armed) { rs.dataset.armed = "1"; rs.textContent = "Tap again to reset " + y; return; }
    delete picks[y]; delete opened[y]; save(); store(LS_OPEN, opened); count();
    pauseVideo(); closeMini(); miniCtl = { next(){ if (S.cur < total - 1) play(S.cur + 1); }, prev(){ if (S.cur > 0) play(S.cur - 1); } };
    S.cur = -1; delete rs.dataset.armed; rs.textContent = "↺ Reset " + y; first = true; renderGrid();
    say(y + " has been reset. All songs are hidden again.");
  });
  rs.setAttribute("aria-label", "Reset " + y + ": clear your pick and hide the songs again");
  pager.appendChild(rs);
  pager.appendChild(y < LAST ? linkBtn("Next year: " + (y + 1) + " ▸", "accent", "#" + (y + 1)) : linkBtn("See my picks", "accent", "#mypicks"));
  v.append(head, grid, pager, el("p", "disclaimer", DISCLAIMER));

  const mini = $("#mini"), ythost = $("#mYt"), sphost = $("#mSp"), nomedia = $("#mNo");
  paintMute();

  function card(j, fresh){
    const s = Y.songs[j], open = isOpen(y, j), mine = picks[y] === j;
    const c = el("article", "card" + (open ? "" : " blurred") + (j === S.cur ? " current" : ""));
    if (!fresh) c.style.animation = "none";
    const art = el("button", "art"); art.type = "button";
    art.setAttribute("aria-label", open ? "Play " + s.t + " by " + s.a : "Song " + (j + 1) + ", hidden. Tap to reveal and play.");
    const pic = el("span", "pic");
    if (s.v) { const img = el("img"); img.src = "https://i.ytimg.com/vi/" + s.v + "/hqdefault.jpg"; img.alt = ""; img.loading = "lazy"; pic.appendChild(img); }
    else { const d = el("span", "disc"); d.appendChild(el("b", null, j + 1)); pic.appendChild(d); }
    art.append(pic, el("span", "playic", "▶"));
    if (!open) art.appendChild(el("span", "tapnote", "Tap to reveal"));
    art.addEventListener("click", () => { openSong(y, j); S.cur = j; renderGrid(); play(j); });
    const meta = el("div", "meta");
    meta.append(el("h2", "t", s.t), el("p", "a", s.a));
    if (open && talliesLoaded && totalVotes(y)) meta.appendChild(el("p", "pc", pct(y, j) + "% picked this"));
    const sv = el("button", "save" + (mine ? " on" : ""), mine ? "✓ My pick" : "Pick this song"); sv.type = "button";
    sv.setAttribute("aria-label", (mine ? "Your pick: " : "Pick ") + s.t + " as your " + y + " song");
    sv.addEventListener("click", () => {
      if (picks[y] === j) return;
      castVote(y, j); picks[y] = j; save(); count();
      say(s.t + " is your song for " + y + ".");
      renderGrid();
    });
    meta.appendChild(sv);
    c.append(art, meta);
    return c;
  }
  let first = true;
  function renderGrid(){
    grid.textContent = "";
    for (let j = 0; j < total; j++) grid.appendChild(card(j, first));
    first = false;
  }

  function play(j){
    S.cur = j; mini.classList.add("open");
    [...grid.children].forEach((c, k) => c.classList.toggle("current", k === j));
    const s = Y.songs[j];
    mini.classList.toggle("blurred", !isOpen(y, j));
    $("#mPlay").classList.toggle("hide", !s.v); $("#mSeekRow").classList.toggle("hide", !s.v); $("#mSeek").value = 0; $("#mCur").textContent = "0:00"; $("#mDur").textContent = "0:00";
    $("#mY").textContent = y; $("#mT").textContent = isOpen(y, j) ? s.t : "Song " + (j + 1); $("#mA").textContent = isOpen(y, j) ? s.a : "Tap the card to reveal";
    sphost.textContent = ""; sphost.classList.add("hide");
    nomedia.textContent = ""; nomedia.classList.add("hide");
    onEnded = null;
    onYtError = () => { ythost.classList.add("hide"); nomedia.textContent = ""; nomedia.append(extLink("YouTube", ytSearch(s)), " · ", extLink("Spotify", spSearch(s))); nomedia.classList.remove("hide"); };
    if (s.v) { ythost.classList.remove("hide"); mountVideo(ythost, s.v, PREVIEW_START, true, muted); }
    else {
      pauseVideo(); ythost.classList.add("hide");
      if (s.sp) { sphost.appendChild(spotifyFrame(s.sp, s.t)); sphost.classList.remove("hide"); }
      else { nomedia.append(extLink("YouTube", ytSearch(s)), " · ", extLink("Spotify", spSearch(s))); nomedia.classList.remove("hide"); }
    }
    say(isOpen(y, j) ? "Playing " + s.t + " by " + s.a : "Song " + (j + 1) + " is playing. Tap it to reveal.");
  }

  miniCtl = {
    next(){ if (S.cur < total - 1) play(S.cur + 1); },
    prev(){ if (S.cur > 0) play(S.cur - 1); }
  };

  refreshVotes = () => renderGrid();
  renderGrid();
}

/* ---------- Routing ---------- */
function route(){
  const h = location.hash.slice(1);
  const y = parseInt(h, 10);
  stopTicker(); refreshVotes = () => {}; closeMini();
  if (!queue) destroyPlayer();
  if (BY[y]) {
    if (queue) closeDock();
    year(y); scrollTo({top: 0});
  } else if (h === "years" || h === "mypicks") {
    home();
    if (h === "mypicks") { const e = document.getElementById("mypicks"); if (e) e.scrollIntoView(); }
    else scrollTo({top: 0});
  } else {
    landing(); scrollTo({top: 0});
  }
}
addEventListener("hashchange", route);
route();
loadTallies();
setInterval(() => { if (document.visibilityState === "visible") loadTallies(); }, 60000);
</script>
